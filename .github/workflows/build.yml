name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests with reasons
        if: always()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  s = tc.find('skipped')
                  if s is not None:
                      n += 1
                      reason = s.get('message') or (s.text or '').strip() or 'no message'
                      print(f"SKIPPED: {tc.get('classname')}.{tc.get('name')} -- reason: {reason}")
          print(f"Total skipped tests: {n}")
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
